[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "velaguard-cloud"
version = "0.2.0"
description = "VelaGuard read-only MQTT cloud dashboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "paho-mqtt>=2.1.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-timeout>=2.3.0",
]

[project.scripts]
vg-dashboard = "dashboard.__main__:main"

[tool.setuptools.packages.find]
include = ["dashboard*"]

[tool.setuptools.package-data]
"dashboard" = ["web/*.html", "web/*.js", "web/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: requires a local MQTT broker",
]
