# Local Mosquitto for AI Bridge verification (controlled-LAN / localhost only).
# Production requires MQTTS + per-device credentials + ACLs.
services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped
