# Local/dev Mosquitto for controlled-LAN verification only.
# Do NOT use plaintext anonymous MQTT in production.

listener 1883
allow_anonymous true
persistence false

# WebSocket listener for the browser debug console (dev only).
# Same anonymous plaintext posture as 1883; do NOT use in production.
listener 9001
protocol websockets

# Keep logs quiet enough for docker compose.
log_dest stdout
log_type error
log_type warning
log_type notice
